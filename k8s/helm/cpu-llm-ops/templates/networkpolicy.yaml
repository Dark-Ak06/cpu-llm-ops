{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cpu-llm-ops.fullname" . }}
  labels:
    {{- include "cpu-llm-ops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cpu-llm-ops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic on service HTTP port from within cluster
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow DNS queries to CoreDNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS egress for model download from Hugging Face
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}
