apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cpu-llm-ops.fullname" . }}-config
  labels:
    {{- include "cpu-llm-ops.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: "{{ .Values.service.port }}"
  MODEL_NAME: {{ .Values.model.name | quote }}
  MODEL_FILE: {{ .Values.model.file | quote }}
  MODEL_PATH: {{ .Values.model.path | quote }}
  MODEL_SHA256: {{ .Values.model.sha256 | quote }}
  MODEL_URL: {{ .Values.model.url | quote }}
  N_THREADS: "{{ .Values.runtime.nThreads }}"
  N_CTX: "{{ .Values.runtime.nCtx }}"
  N_BATCH: "{{ .Values.runtime.nBatch }}"
  MAX_CONCURRENT_REQUESTS: "{{ .Values.runtime.maxConcurrentRequests }}"
  MAX_QUEUE_DEPTH: "{{ .Values.runtime.maxQueueDepth }}"
  REQUEST_TIMEOUT_SECONDS: "{{ .Values.runtime.requestTimeoutSeconds }}"
  MAX_TOKENS_LIMIT: "{{ .Values.runtime.maxTokensLimit }}"
  MOCK_INFERENCE: "{{ .Values.runtime.mockInference }}"
  LOG_LEVEL: "INFO"
